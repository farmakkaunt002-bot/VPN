name: build-apk

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build libbox.aar
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH=$PATH:$(go env GOPATH)/bin
          git clone --depth 1 -b v1.11.0 https://github.com/SagerNet/sing-box.git
          cd sing-box
          make lib_install || true
          if ! command -v gomobile >/dev/null 2>&1; then
            go install golang.org/x/mobile/cmd/gomobile@latest
            go install golang.org/x/mobile/cmd/gobind@latest
            go get golang.org/x/mobile@latest || true
          fi
          gomobile init || true
          if [ -d experimental/libbox ]; then LB=./experimental/libbox; else LB=./libbox; fi
          gomobile bind -v -androidapi 21 -javapkg=io.nekohasekai -libname=box -tags with_clash_api $LB
          mkdir -p ../app/libs
          cp "$(ls -1 *.aar | head -1)" ../app/libs/libbox.aar
          ls -la ../app/libs

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: KSVpn-apk
          path: app/build/outputs/apk/debug/app-debug.apk
